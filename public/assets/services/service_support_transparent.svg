<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="s_glow1" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#008fd3" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#008fd3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s_card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1A2B"/>
      <stop offset="100%" stop-color="#0B1421"/>
    </linearGradient>
    <linearGradient id="s_bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008fd3"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect x="80" y="30" width="640" height="540" rx="24" fill="url(#s_glow1)"/>
  <rect x="150" y="55" width="500" height="490" rx="18" fill="url(#s_card)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <circle cx="182" cy="88" r="4" fill="#008fd3"/>
  <circle cx="198" cy="88" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="214" cy="88" r="4" fill="rgba(255,255,255,0.4)"/>
  <text x="234" y="92" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AMS OPERATIONS CONSOLE</text>
  <line x1="150" y1="112" x2="650" y2="112" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Top availability card -->
  <g transform="translate(176, 130)">
    <rect width="448" height="100" rx="12" fill="rgba(0,143,211,0.14)" stroke="rgba(0,143,211,0.45)" stroke-width="1"/>
    <text x="18" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LANDSCAPE AVAILABILITY</text>
    <text x="18" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800">99.99%</text>
    <text x="330" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">COVERAGE</text>
    <text x="330" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">24/7/365</text>
    <rect x="18" y="82" width="412" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
    <rect x="18" y="82" width="400" height="6" rx="3" fill="url(#s_bar)"/>
  </g>

  <!-- 2-col stats -->
  <g transform="translate(176, 245)">
    <rect width="216" height="84" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="16" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FIRST RESPONSE</text>
    <text x="16" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">&lt;15 min</text>
  </g>
  <g transform="translate(408, 245)">
    <rect width="216" height="84" rx="12" fill="rgba(139,124,246,0.15)" stroke="rgba(139,124,246,0.4)" stroke-width="1"/>
    <text x="16" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SUPPORT TIERS</text>
    <text x="16" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">L1 &#8211; L3</text>
  </g>

  <!-- Incident rows -->
  <g transform="translate(176, 345)">
    <rect width="448" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="24" cy="25" r="4" fill="#008fd3"/>
    <text x="44" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Incident queue</text>
    <text x="375" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">04 open</text>
  </g>

  <g transform="translate(176, 408)">
    <rect width="448" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="24" cy="25" r="4" fill="#8B7CF6"/>
    <text x="44" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Release &amp; upgrade window</text>
    <text x="365" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Sat 02:00</text>
  </g>
